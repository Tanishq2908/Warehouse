# ── Production override ────────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:

  mongo:
    ports: []                        # don't expose MongoDB externally in prod

  backend:
    volumes:
      - uploads_data:/app/uploads    # only mount uploads, not source code
    command: >
      uvicorn server:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --proxy-headers
        --forwarded-allow-ips=*

  # Replace the Vite dev server with nginx serving the built dist/
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod    # multi-stage: npm build + nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /app/node_modules: {}        # remove the dev volume override
    environment:
      VITE_BACKEND_URL: ""           # not needed at runtime (nginx proxies /api)
