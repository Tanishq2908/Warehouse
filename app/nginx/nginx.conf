server {
    listen 80;
    server_name _;

    # Gzip for frontend assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve the built React SPA
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively (hashed filenames from Vite)
    location ~* \.(js|css|woff2?|ttf|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all /api/* calls to the FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Allow large file uploads (bill images)
        client_max_body_size 15M;
    }

    # Fallback to index.html for React Router (HashRouter works without this,
    # but keep it for BrowserRouter fallback if you ever switch)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
